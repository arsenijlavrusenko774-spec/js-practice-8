
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог товаров</title>
  <link rel="stylesheet" href="style.css">
  <script src="student-template.js" defer></script>
</head>
<body>
  <h1>Каталог товаров</h1>

  <section>
    <h2>Статистика</h2>
    <p>Количество товаров: <span id="product-count">0</span></p>
    <p>В наличии: <span id="available-count">0</span></p>
    <p>Общая стоимость: <span id="total-price">0</span> ₽</p>
    <p>Самый дорогой товар: <span id="most-expensive"></span></p>
  </section>

  <section>
    <h2>Товары по категориям</h2>
    <ul id="category-stats"></ul>
  </section>

  <section>
    <h2>Каталог</h2>
    <div id="catalog"></div>
  </section>
</body>
</html>
